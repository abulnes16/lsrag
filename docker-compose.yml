services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    ports:
      - "3000:3000"
    networks:
      - frontend-backend
    depends_on:
      - backend
    command: sh -c "yarn install && yarn dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      - "8000:8000"
    networks:
      - frontend-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - data-provider
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./corporate_dataset/gitlab_engineering_workflow_dataset:/app/corporate_dataset
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DATA_PATH=/app/data
      - LIGHTRAG_DIR=${LIGHTRAG_DIR:-lightrag_cache}
      - CORPORATE_DATASET_PATH=/app/corporate_dataset
    env_file:
      - ./backend/.env
    restart: unless-stopped

  data-provider:
    build:
      context: ./data-provider
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: "no"
    # This container will download the data and exit.

networks:
  frontend-backend:
    driver: bridge

# The data is now saved in the local ./data directory so you can view it
