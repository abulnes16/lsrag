version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - frontend-backend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      - "8000:8000"
    networks:
      - frontend-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - data-provider
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DATA_PATH=/app/data
    restart: unless-stopped

  data-provider:
    build:
      context: ./data-provider
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: "no"
    # Este contenedor descargará los datos y finalizará.

networks:
  frontend-backend:
    driver: bridge

# Los datos ahora se guardan en el directorio local ./data para que los puedas ver
